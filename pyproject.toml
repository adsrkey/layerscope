[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "layerscope"
version = "0.3.0"
description = "layerscope — разбор Qwen3.5/3.8 на MLX: от промпта к ответу и какие слои за него отвечают"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mlx>=0.32",
    "mlx-vlm>=0.7.12",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
layerscope = "layerscope.__main__:main"

[tool.setuptools.packages.find]
include = ["layerscope*"]

[tool.setuptools.package-data]
"layerscope.report" = ["template.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
